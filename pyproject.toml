[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pelletlab-cine-viewer"
version = "0.2.0"
description = "View Phantom .cine files from the pellet lab and make calibrated measurements in napari."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ORNL Fusion" }]
keywords = ["napari", "cine", "phantom", "pellet", "fusion", "high-speed video"]

dependencies = [
    "napari[all]>=0.7",
    "pycine>=0.3.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "qtpy>=2.4",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
filters = ["napari-skimage"]

[project.scripts]
pellet-viewer = "pelletVideoViewer:main"

[project.urls]
Repository = "https://github.com/ORNL-Fusion/PelletLabCineViewer"

# The modules live in code/ rather than in a package directory, so point
# setuptools at that folder and list the modules explicitly.  (Do NOT turn
# code/ into a package named `code` — that shadows the `code` module in the
# standard library.)
[tool.setuptools]
py-modules = ["pelletVideoViewer", "pellet_cylinder"]

[tool.setuptools.package-dir]
"" = "code"
